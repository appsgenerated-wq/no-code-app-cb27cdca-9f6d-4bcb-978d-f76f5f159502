name: MonkeyLog
entities:
  User:
    authenticable: true
    properties:
      - name
      - { name: email, type: email }
      - { name: role, type: choice, options: { values: [Researcher, Enthusiast], default: Enthusiast } }
    policies:
      create:
        - access: admin
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - access: admin
      signup:
        - access: public

  Monkey:
    properties:
      - { name: name, type: string }
      - { name: species, type: string }
      - { name: habitat, type: choice, options: { values: [Jungle, Savanna, Mountain, Forest], default: Jungle } }
      - { name: sightingNotes, type: text }
      - { name: sightingDate, type: date }
      - { name: photo, type: image, options: { sizes: { thumbnail: { width: 400, height: 400 }, medium: { width: 800 } } } }
    belongsTo:
      - { name: owner, entity: User }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - { access: restricted, allow: User, condition: self }


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck